name: Release

# Push a tag such as v0.1.0 (it must equal the version in package.json) to test the extension,
# run it inside VS Code, package it and attach the VSIX to a GitHub Release.
#
# Publishing to the Visual Studio Marketplace uses Trusted Publishing (OIDC), so no token is
# stored anywhere. One-time setup on https://marketplace.visualstudio.com/manage: open the
# publisher, then Trusted Publishing → Create, with owner "ziyisun85-ops", repository
# "ServerLens", workflow "release.yml" and no environment. After that, either
#   - run this workflow manually (Actions → Release → Run workflow), choose the tag and tick
#     "Publish to the Visual Studio Marketplace", or
#   - set the repository variable MARKETPLACE_PUBLISH to "true" so tag pushes publish directly.
# See docs/PUBLISHING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Visual Studio Marketplace (Trusted Publishing must be set up)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Lint and test
        run: npm test

      - name: Run the extension in VS Code
        shell: bash
        run: |
          set -o pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          xvfb-run -a npm run test:vscode

      - name: Package
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          npx vsce package --out "serverlens-$version.vsix"
          echo "vsix=serverlens-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.vsix }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

      - name: Create or update the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.package.outputs.vsix }}
        run: |
          # Release notes: the first section of CHANGELOG.md, up to the next heading or rule.
          awk 'BEGIN { p = 0 } /^## / { if (p) exit; p = 1 } /^---/ { if (p) exit } p' CHANGELOG.md > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --title "ServerLens $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi

      - name: Publish to the Visual Studio Marketplace
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.MARKETPLACE_PUBLISH == 'true')
        shell: bash
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
        run: npx vsce publish --oidc --packagePath "$VSIX" --skip-duplicate

      - name: Explain how to publish
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.MARKETPLACE_PUBLISH == 'true')) }}
        run: echo "::notice::Not published to the Marketplace. After setting up Trusted Publishing, run this workflow for the tag with 'Publish' ticked (see docs/PUBLISHING.md)."
