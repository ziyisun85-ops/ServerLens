name: Release

# Push a tag such as v0.1.0 (it must equal the version in package.json) to release. The workflow
# tests the extension, runs it inside VS Code, packages it, attaches the VSIX to a GitHub Release
# and publishes it to the Visual Studio Marketplace.
#
# Marketplace publishing uses Trusted Publishing (OIDC), so no token is stored anywhere. One-time
# setup on https://marketplace.visualstudio.com/manage: create the publisher "ziyisun85-ops", then
# Trusted Publishing → Create with owner "ziyisun85-ops", repository "ServerLens", workflow
# "release.yml" and no environment. Until that exists the publish job fails (the GitHub Release is
# created anyway); after the setup, open that run and use "Re-run failed jobs". See docs/PUBLISHING.md.
#
# The jobs are split so that installing and testing dependencies never runs with write access or
# with the right to obtain a Marketplace credential.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Visual Studio Marketplace (run from a v* tag; Trusted Publishing must be set up)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - name: Require a release tag for publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo '::error::To publish, choose the release tag (v<version>) under "Use workflow from".'
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Lint and test
        run: npm test

      - name: Run the extension in VS Code
        shell: bash
        run: |
          set -o pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          # The log goes outside the checkout so it can never end up in the package.
          log="$RUNNER_TEMP/vscode-test.log"
          xvfb-run -a npm run test:vscode 2>&1 | tee "$log"
          version=$(grep -a -m1 'ServerLens extension tests in VS Code' "$log" | sed 's/.*VS Code //' || true)
          echo "::notice title=VS Code tests::$(grep -a -c '✓' "$log" || true) checks passed (VS Code ${version:-unknown})"

      - name: Package
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          npx vsce package --out "serverlens-$version.vsix"
          echo "vsix=serverlens-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Check the package contents
        shell: bash
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
        run: |
          # Only runtime files may ship; anything else (logs, sources, test output) fails the build.
          files=$(unzip -Z1 "$VSIX")
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$count" -lt 10 ] || ! printf '%s\n' "$files" | grep -qx 'extension/out/extension.js'; then
            echo "::error::$VSIX looks incomplete ($count files)."
            exit 1
          fi
          unexpected=$(printf '%s\n' "$files" | grep -v -E '^(\[Content_Types\]\.xml|extension\.vsixmanifest|extension/(package\.json|readme\.md|changelog\.md|LICENSE\.txt|NOTICE|out/.+\.(js|json)|resources/.+))$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files in $VSIX: $(echo $unexpected)"
            exit 1
          fi
          echo "::notice title=Package::$count files in $VSIX"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          # Release notes: the first section of CHANGELOG.md, up to the next heading or rule.
          awk 'BEGIN { p = 0 } /^## / { if (p) exit; p = 1 } /^---/ { if (p) exit } p' CHANGELOG.md > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --title "ServerLens $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi

  publish:
    needs: [build, github-release]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish to the Visual Studio Marketplace
        shell: bash
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          # Only vsce is installed here, without running any package install scripts.
          npm_config_ignore_scripts: 'true'
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "$VSIX" --skip-duplicate

      - name: Explain a failed Marketplace upload
        if: failure()
        run: |
          echo "::error title=Marketplace publishing failed::The VSIX is attached to the GitHub Release. For the first release, create the Marketplace publisher ziyisun85-ops and a Trusted Publishing policy for this repository and release.yml (docs/PUBLISHING.md), then use Re-run failed jobs."
